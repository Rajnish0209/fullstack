<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms and button</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Register for the meetup</h1>
  <form action="" method="get">
    <p>
      Choose hotel room type:
    </p>
    <div>
      <input type="radio" name="hotel" value="economy" id="economy">
      <label for="economy">Economy</label>
      <input type="radio" name="hotel" value="superior" id="superior">
      <label for="superior">Superior</label>
      <input type="radio" name="hotel" value="penthouse" id="penthouse">
      <label for="penthouse">Penthouse</label>
    </div>
    <div>
      <p>
        Choose classes to attend:
      </p>
      <input type="checkbox" name="classes" value="yoga" id="yoga">
      <label for="yoga">Yoga</label>
      <input type="checkbox" name="classes" value="coffee roasting" id="coffee roasting">
      <label for="coffee roasting">Coffee roasting</label>
      <input type="checkbox" name="classes" value="balloon animal art" id="balloon animal art">
      <label for="balloon animal art">Balloon animal art</label>
    </div>
    <div>
      <label for="transport">How are you getting here:</label>
      <select name="transport" id="transport">
        <option value="">--Please choose an option--</option>
        <option value="plane">Plane</option>
        <option value="bike">Bike</option>
        <option value="walk">Walk</option>
        <option value="bus">Bus</option>
        <option value="train">Train</option>
        <option value="jetPack">Jet pack</option>
      </select>
    </div>
    <div>
      <label for="comments">Any other comments:</label>
      <textarea name="comments" id="comments" rows="10"></textarea>
    </div>
    <button type="submit">Continue to payment</button>
  </form>



  <script src="script.js"></script>
</body>

</html>
