<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms and button</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <form action="" method="get">
    <fieldset>
      <legend>Who is your favorite pony?</legend>
      <ul>
        <li>
          <label for="pinkiePie">Pinkie Pie</label>
          <input type="radio" name="pony" value="pinkiePie" id="pinkiePie" checked>
        </li>
        <li>
          <label for="rainowDash">Rainbow Dash</label>
          <input type="radio" name="pony" value="rainowDash" id="rainowDash">
        </li>
        <li>
          <label for="twilightSparkel">Twilight Sparkle</label>
          <input type="radio" name="pony" value="twilightSparkel" id="twilightSparkel">
        </li>
      </ul>
    </fieldset>
    <fieldset>
      <legend>Hotdog preferences</legend>
      <ul>
        <li>
          <label for="vegan">Vegan</label>
          <input type="checkbox" name="hotdog" value="vegan" id="vegan">
        </li>
        <li>
          <label for="onions">Onions</label>
          <input type="checkbox" name="hotdog" value="onions" id="onions">
        </li>
        <li>
          <label for="mustard">Mustard</label>
          <input type="checkbox" name="hotdog" value="mustard" id="mustard">
        </li>
        <li>
          <label for="ketchup">Ketchup</label>
          <input type="checkbox" name="hotdog" value="ketchup" id="ketchup">
        </li>
      </ul>
    </fieldset>
    <button>Submit</button>
  </form>


  <script src="script.js"></script>
</body>

</html>
